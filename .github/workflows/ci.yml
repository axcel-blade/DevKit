name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release
      - name: App smoke (doctor)
        run: cargo run --release -- doctor

  mono-msi-smoke:
    name: Mono MSI layout (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Extract Mono MSI and verify layout
        run: cargo test --release mono_msi_admin_extract_layout -- --ignored
        env:
          DEVKIT_MONO_MSI_SMOKE: "1"
          # Keep msiexec TARGETDIR short on the runner.
          RUNNER_TEMP: ${{ runner.temp }}
