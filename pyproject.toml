[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DevKit"
version = "0.2.0"
description = "DevKit application — install developer SDKs and configure environment variables"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Axcel Blade", email = "author@example.com" }]
dependencies = []

[project.optional-dependencies]
dev = ['pytest>=8.0', 'pytest-cov>=5.0', 'ruff>=0.9', 'mypy>=1.8']

# Optional: puts `devkit` on PATH after `pip install -e .` (for local development).
# Preferred way to run the app is still `python main.py` / `devkit.bat` / `./devkit.sh`.
[project.scripts]
devkit = "devkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source_pkgs = ["devkit"]
branch = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
mypy_path = "src"
