[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myapp"
version = "0.1.0"
description = "myapp — generated by auto-gen-py-project"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Author", email = "author@example.com" }]
dependencies = []

[project.optional-dependencies]
dev = ['pytest>=8.0', 'pytest-cov>=5.0', 'ruff>=0.9', 'mypy>=1.8']

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
