[package]
name = "devkit"
version = "0.9.2"
edition = "2021"
description = "DevKit application — install developer SDKs and configure environment variables"
license = "MIT"
authors = ["Axcel Blade <author@example.com>"]
readme = "README.md"

[[bin]]
name = "devkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip", "json"] }
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
xz2 = { version = "0.1", features = ["static"] }
regex = "1.10"
dirs = "5.0"
which = "6.0"
indicatif = "0.17"
tempfile = "3.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.52"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
