# DevKit CLI via Docker Compose.
# Usage:
#   docker compose run --rm devkit doctor
#   docker compose run --rm devkit list
#   docker compose run --rm devkit install hello
#
# SDK installs persist in the named volume `devkit-data` (DEVKIT_HOME=/devkit).

services:
  devkit:
    build: .
    image: devkit:local
    environment:
      DEVKIT_HOME: /devkit
    volumes:
      - devkit-data:/devkit
    # Default command is `doctor`; override with: docker compose run --rm devkit list
    command: ["doctor"]

volumes:
  devkit-data:
